<head>
<meta charset="UTF-8">

<title>Melanie-DHB</title>
<style>
  :root{
    --bg:#0e0b14;
    --card:#181321;
    --ink:#f3eef7;
    --muted:#a99fb8;
    --accent:#e0567a;
    --accent-2:#7b4bd6;
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(123,75,214,.35), transparent 60%),
      radial-gradient(900px 500px at 50% 110%, rgba(224,86,122,.25), transparent 60%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 20px;
  }
  .wrap{width:100%;max-width:440px}
  .avatar{
    width:200px;height:auto;display:block;margin:0 auto 18px;
  }
  h1{
    text-align:center;font-size:1.9rem;font-weight:800;
    letter-spacing:-.02em;margin-bottom:12px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .bio{
    text-align:center;color:var(--muted);font-size:.98rem;
    line-height:1.55;margin:0 auto 30px;max-width:380px;
  }
  .eyebrow{
    text-align:center;text-transform:uppercase;letter-spacing:.18em;
    font-size:.72rem;color:var(--muted);margin-bottom:16px;
  }
  .links{display:flex;flex-direction:column;gap:14px}
  .link{
    display:flex;align-items:center;gap:16px;
    background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:16px 20px;
    color:var(--ink);text-decoration:none;font-weight:600;
    transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
  }
  .link:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .icon{
    width:26px;height:26px;flex:0 0 26px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon svg{width:100%;height:100%}
  .link .chev{margin-left:auto;color:var(--muted)}
  footer{text-align:center;margin-top:36px;color:var(--muted);font-size:.75rem}
  @media (prefers-reduced-motion:reduce){.link{transition:none}}
</style>
</head>
